services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: strong_root_password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: strong_db_password
    volumes:
      - mysql_data:/var/lib/mysql

  nextcloud:
    build: .
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: strong_db_password
      XDEBUG_MODE: develop,debug
      XDEBUG_CONFIG: "client_host=${MY_IP:-172.17.0.1} discover_client_host=0 client_port=9003"
      XDEBUG_TRIGGER: "default_no_matter"
      PHP_IDE_CONFIG: "serverName=${DEV_SERVER_NAME:-nextcloud.lvh.me}"
    volumes:
     - ./server:/app/web

  eurooffice:
    image: ghcr.io/euro-office/documentserver:v9.3.1
    ports:
      - "8081:80"
    environment:
    # at-least-32-chars-long-for-hs256
      - JWT_SECRET=aa9UQuahiNg5zeufeiVaer7OEet7eumiDohlah1x
      - EXAMPLE_ENABLED=true
    # volumes:
    #   - eurooffice_data:/var/lib/eurooffice
    #   - eurooffice_config:/etc/eurooffice

volumes:
  mysql_data:
  nextcloud_html:
  nextcloud_data:
  eurooffice_data:
  eurooffice_config:
